{% extends "base.html" %}
{% block title %}删除萎凋槽{% endblock %}
{% block content %}
<div class="page-header">
  <h1>删除萎凋槽</h1>
</div>
<div class="card">
  <p>确认删除槽位「{{ object.garden.name }} / {{ object.troughCode }}」？相关批次将一并删除。</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认删除</button>
    <a class="btn btn-secondary" href="{% url 'trough_list' %}">取消</a>
  </form>
</div>
{% endblock %}
