services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teawither
      POSTGRES_USER: teawither
      POSTGRES_PASSWORD: teawither
    ports:
      - "5800:5432"
    volumes:
      - teawither_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teawither -d teawither"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 90s

  web:
    build: .
    ports:
      - "4460:4100"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: teawither
      POSTGRES_USER: teawither
      POSTGRES_PASSWORD: teawither
      CSRF_TRUSTED_ORIGINS: "http://localhost:4460,http://127.0.0.1:4460"
      USE_GUNICORN: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  teawither_pg:
