{% if troughs %}
<table class="data">
  <thead>
    <tr>
      <th>茶园</th>
      <th>槽位编号</th>
      <th>品种</th>
      <th>装叶量(kg)</th>
      <th>状态</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for t in troughs %}
    <tr>
      <td>{{ t.garden.name }}</td>
      <td>{{ t.troughCode }}</td>
      <td>{{ t.cultivar }}</td>
      <td>{{ t.loadKg }}</td>
      <td><span class="badge badge-{{ t.status }}">{{ t.get_status_display }}</span></td>
      <td class="actions">
        <a class="btn btn-sm btn-secondary" href="{% url 'trough_edit' t.pk %}">编辑</a>
        <a class="btn btn-sm btn-danger" href="{% url 'trough_delete' t.pk %}">删除</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">暂无萎凋槽。</p>
{% endif %}
